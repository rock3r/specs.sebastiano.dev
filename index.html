  <meta name="theme-color" content="#f4e04d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#231d18" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Sebastiano's public index of project specs and design documents.">

  <link rel="icon" href="favicon.ico" type="image/x-icon">

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-band">
    <div class="site-header page-shell">
      <a class="identity" href="./" aria-label="Specs home">
        <span class="monogram" aria-hidden="true">SP</span>
        <span>Specs</span>
      </a>
      <a class="home-link" href="https://sebastiano.dev/">sebastiano.dev</a>
    </div>
  </header>

  <main id="main">
    <div class="hero">
      <header class="intro page-shell">
        <h1>Specs and design notes<span aria-hidden="true">.</span></h1>
        <p class="intro-copy">Browse design decisions, test evidence, and implementation plans by project. <a href="https://sebastiano.dev/updates/?tag=spec">Follow spec updates</a>.</p>
        <p class="catalog-meta" id="catalog-meta" role="status" tabindex="-1">Loading the index…</p>

      <p class="loading" id="catalog-loading">Loading specs…</p>
      <div id="catalog-projects" hidden></div>

      <div class="notice" id="catalog-error" hidden>
        <button type="button" id="catalog-retry">Try again</button>
      </div>
    </div>
    <noscript>
      <style>#catalog, #catalog-meta { display: none; }</style>
      <p class="notice page-shell">Enable JavaScript to load the catalog from <a href="specs.json">specs.json</a>.</p>
    </noscript>
  </main>

  <footer class="page-shell">
    <span>Made by Sebastiano</span>
    <a href="https://sebastiano.dev/">Back home</a>
  </footer>
  <script src="site.js" defer></script>
